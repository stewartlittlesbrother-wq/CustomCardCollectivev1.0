<!DOCTYPE html>
<html lang="en" class="touch-device">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/self.css?v=layouttest">
<link rel="stylesheet" href="../css/manual-play.css?v=layouttest">
<style>
  .ph { background: linear-gradient(150deg,#3a3550,#211d33 60%,#191527); }
  .ph2 { background: repeating-linear-gradient(135deg,#2a2540 0 6px,#241f38 6px 12px); }
</style>
</head>
<body>
  <aside class="manual-sidebar" id="manualSidebar">
    <h3>Tools</h3>
    <button class="tool-btn">→ Draw Arrow</button>
    <button class="tool-btn secondary">⟲ Reset Arrows</button>
    <button class="tool-btn secondary">↺ Restand All</button>
    <button class="tool-btn">✎ Add Note</button>
    <button class="tool-btn warning">✖ Clear Notes</button>
    <button class="tool-btn secondary">▦ Extra Slots: Off</button>
    <button class="tool-btn secondary">🔊 Sound: On</button>
  </aside>
  <a href="#" class="btn-back">Back to Lobby</a>

  <main class="self-page">
    <aside class="extra-zones-column" id="extraZonesColumn">
      <div class="extra-zones-group"><div class="area extra-faceup-area"></div></div>
    </aside>

    <div class="game-layout">
      <section class="game-board">

        <div class="hand opponent-hand">
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
        </div>

        <section class="play-area opponent-area">
          <div class="character-area">
            <div class="character-label">Character Area</div>
            <div class="character-slot"><img class="board-card-img board-character-card ph" alt=""></div>
            <div class="character-slot"><img class="board-card-img board-character-card ph" alt=""></div>
            <div class="character-slot"></div>
            <div class="character-slot"><img class="board-card-img board-character-card ph" alt=""></div>
            <div class="character-slot"></div>
          </div>
          <div class="life-area open"><span class="life-toggle-text">Life</span></div>
          <div class="area leader-area"><img class="leader-card-img board-leader-card ph" alt=""></div>
          <div class="area stage-area"></div>
          <div class="area deck-area"><img class="deck-card-img ph2" alt=""></div>
          <div class="area don-deck-area"><img class="ph2" style="width:100%;height:100%" alt=""></div>
          <div class="area don-area">
            <img class="don-card-img" alt=""><img class="don-card-img" alt=""><img class="don-card-img" alt="">
            <img class="don-card-img" alt=""><img class="don-card-img" alt=""><img class="don-card-img" alt="">
          </div>
          <div class="area trash-area"><img class="deck-card-img ph2" alt=""></div>
        </section>

        <section class="play-area player-area">
          <div class="character-area">
            <div class="character-label">Character Area</div>
            <div class="character-slot"><img class="board-card-img board-character-card ph" alt=""></div>
            <div class="character-slot"></div>
            <div class="character-slot"><img class="board-card-img board-character-card ph" alt=""></div>
            <div class="character-slot"></div>
            <div class="character-slot"><img class="board-card-img board-character-card ph" alt=""></div>
          </div>
          <div class="life-area open"><span class="life-toggle-text">Life</span></div>
          <div class="area leader-area"><img class="leader-card-img board-leader-card ph" alt=""></div>
          <div class="area stage-area"></div>
          <div class="area deck-area"><img class="deck-card-img ph2" alt=""></div>
          <div class="area don-deck-area"><img class="ph2" style="width:100%;height:100%" alt=""></div>
          <div class="area don-area">
            <img class="don-card-img" alt=""><img class="don-card-img" alt=""><img class="don-card-img" alt="">
            <img class="don-card-img" alt=""><img class="don-card-img" alt=""><img class="don-card-img" alt="">
          </div>
          <div class="area trash-area"><img class="deck-card-img ph2" alt=""></div>
        </section>

        <div class="hand player-hand">
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
          <div class="hand-card"><img class="hand-card-img ph" alt=""></div>
        </div>

      </section>
    </div>

    <aside class="card-preview-panel">
      <div class="card-preview"><div class="preview-placeholder">Preview</div></div>
      <div class="game-log"><h3>Game Log</h3></div>
    </aside>
  </main>

  <script>
  function fit() {
    const root = getComputedStyle(document.documentElement);
    const px = n => parseFloat(root.getPropertyValue(n)) || 0;
    const rails = px("--tools-w") + px("--pile-rail-w") + px("--preview-rail-w");
    const board = document.querySelector(".game-board");
    const pa = board.querySelector(".play-area");
    const DW = pa.offsetWidth || 1210;
    const DH = board.offsetHeight || 1120;
    const vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;
    const scale = Math.max(0.15, Math.min((vw - rails - 16) / DW, (vh - 16) / DH, 1));
    document.documentElement.style.setProperty("--sim-board-scale", scale.toFixed(4));
  }
  fit(); window.addEventListener("resize", fit); setTimeout(fit, 80);
  </script>
</body>
</html>
