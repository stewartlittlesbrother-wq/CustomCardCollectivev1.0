<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tournaments – Golds Customs</title>
    <link rel="icon" type="image/svg+xml" href="../images/basic/custom-sim-logo.svg">
    <!-- Tournaments is a tab in the main app now. Old links (including shared
         ?t=<id> links and the organiser's ?manage=) land on the right tab. -->
    <script>
        (function () {
            var target = new URL("../index.html", location.href);
            var params = new URLSearchParams(location.search);
            target.searchParams.set("view", "tournaments");
            ["t", "manage", "tbase"].forEach(function (key) {
                if (params.get(key)) target.searchParams.set(key, params.get(key));
            });
            location.replace(target.toString());
        })();
    </script>
</head>
<body style="background:#07090a;color:#f3f8f5;font-family:system-ui,sans-serif">
    <p style="padding:24px">Opening Tournaments… <a href="../index.html?view=tournaments" style="color:#4dff9e">Continue</a></p>
</body>
</html>
